<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mpkloop Lessons</title>
<style>
/* Layout: "practice station" — controller drawing + task card beside a lesson rail; reference sheets below. */
:root {
  --bg: #e7e9ec; --surface: #f6f7f9; --sunk: #dfe2e7; --fg: #15171c; --muted: #59606c; --line: #c6cbd3;
  --tape: #f5b31c; --tape-ink: #1a1405; --link: #8a5a00; --ok: #1f9d55; --ok-ink: #ffffff;
  --bank-a: #e8392f; --bank-b: #1fae62;
  --dev-body: #1c1e22; --dev-panel: #24272c; --dev-well: #141619; --dev-btn: #383b42; --dev-pad: #33363c;
  --dev-label: #aeb3bc; --dev-key: #f3f4f6; --dev-black: #121315; --oled: #04060a; --oled-ink: #dfeeff;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114; --surface: #181b20; --sunk: #12151a; --fg: #e7e9ed; --muted: #9aa1ad; --line: #2b3038;
    --tape: #ffbb2e; --tape-ink: #1a1405; --link: #ffc65a; --ok: #2fd27a; --ok-ink: #06240f;
    --bank-a: #ff4d42; --bank-b: #2fd27a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1114; --surface: #181b20; --sunk: #12151a; --fg: #e7e9ed; --muted: #9aa1ad; --line: #2b3038;
  --tape: #ffbb2e; --tape-ink: #1a1405; --link: #ffc65a; --ok: #2fd27a; --ok-ink: #06240f;
  --bank-a: #ff4d42; --bank-b: #2fd27a; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--font-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 64px; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 118%; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; line-height: 1.02; }
h2 { font-size: 1.6rem; font-weight: 750; }
h3 { font-size: 1.25rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--link); }
kbd { font: 600 0.8em var(--font-mono); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--surface); white-space: nowrap; }
code { font: 500 0.9em var(--font-mono); background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.eyebrow { font: 600 0.72rem var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }

/* header */
header.top { display: grid; gap: 14px; margin-bottom: 22px; }
header.top .lede { max-width: 64ch; color: var(--muted); font-size: 1.05rem; }
.tape { display: inline-block; background: var(--tape); color: var(--tape-ink); font: 600 0.8rem var(--font-mono); padding: 3px 10px; transform: rotate(-1.2deg); letter-spacing: 0.04em; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.92rem; }
.toc a { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; color: var(--fg); background: var(--surface); }
.toc a:hover { border-color: var(--tape); }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.85rem; cursor: pointer; color: var(--fg); font-family: var(--font-body); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.chip.on .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.chip.err .dot { background: var(--bank-a); }

/* station */
.station { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 20px; align-items: start; scroll-margin-top: 12px; }
.rail { display: grid; gap: 3px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.rail a { display: grid; grid-template-columns: 26px 1fr 34px; gap: 8px; align-items: baseline; padding: 7px 10px; border-radius: 8px; color: var(--muted); font-size: 0.93rem; line-height: 1.3; text-decoration: none; }
.rail a .n { font: 600 0.78rem var(--font-mono); }
.rail a .prog { font: 500 0.72rem var(--font-mono); text-align: right; color: var(--muted); }
.rail a .prog.full { color: var(--ok); font-weight: 700; }
.rail a:hover { background: var(--sunk); color: var(--fg); }
.rail a[aria-current="true"] { background: var(--surface); color: var(--fg); box-shadow: inset 3px 0 0 var(--tape); font-weight: 600; }
.rail select { display: none; }
.rail .reset { all: unset; cursor: pointer; margin-top: 8px; font-size: 0.78rem; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; padding: 4px 10px; }

.stage { display: grid; gap: 14px; min-width: 0; }
.stagebar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 7px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.15); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.device { background: var(--sunk); border-radius: 14px; padding: 12px; position: relative; }
.device svg { display: block; width: 100%; height: auto; }
.device svg text { font-family: var(--font-mono); user-select: none; }
.ctl { cursor: pointer; }
.ctl:hover .face { filter: brightness(1.25); }
.ring { fill: none; stroke: var(--tape); stroke-width: 4; }
.ring.done { stroke: var(--ok); }
.pulse { animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
.flash { animation: flash 0.9s ease-out forwards; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse, .flash { animation: none; } }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity 0.2s; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
.toast.ok { background: var(--ok); color: var(--ok-ink); }

.lower { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.stepcard .body { display: grid; gap: 10px; }
.stepcard .body p, .stepcard .body li { max-width: 66ch; }
.stepcard ul, .stepcard ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tasks li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--sunk); cursor: pointer; }
.tasks li .num { font: 700 0.75rem var(--font-mono); background: var(--tape); color: var(--tape-ink); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.tasks li.done { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }
.tasks li.done .num { background: var(--ok); color: var(--ok-ink); }
.tasks li .what { font-size: 0.93rem; }
.tasks li .how { color: var(--muted); font-size: 0.8rem; }
.tip { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); font-size: 0.93rem; }
.nav { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.btn { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.92rem; background: var(--fg); color: var(--bg); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.ok { background: var(--ok); color: var(--ok-ink); }
.btn.ready { animation: ready 1.2s ease-in-out infinite; }
@keyframes ready { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: reduce) { .btn.ready { animation: none; } }
.btn[disabled] { opacity: 0.35; cursor: default; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--tape); }
.dots i.done { background: var(--ok); }
.info h3 { font-size: 1.05rem; }
.info .what { color: var(--muted); font-size: 0.93rem; }
.info .state { font: 500 0.78rem var(--font-mono); color: var(--muted); }
.mock { font: 500 0.78rem/1.45 var(--font-mono); background: var(--oled); color: var(--oled-ink); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.mock .t { color: #8a93a3; }
.mock .play { color: #4ade80; } .mock .rec { color: #ff6b61; } .mock .armed { color: #ffd166; } .mock .odub { color: #d8a7ff; } .mock .mute { color: #8a93a3; } .mock .empty { color: #58616f; }
.mock .log { color: #ffd166; }

/* reference */
section.ref { margin-top: 56px; display: grid; gap: 18px; scroll-margin-top: 12px; }
.ref .intro { color: var(--muted); max-width: 70ch; }
.lessonlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.lessonlist ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; font-size: 0.93rem; }
.lessonlist a { color: var(--link); }
.lessonlist li.done a { color: var(--muted); }
.lessonlist li.done::marker { color: var(--ok); }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.lib .card { gap: 8px; padding: 14px 16px; }
.lib ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 0.92rem; }
.padtag { font: 600 0.72rem var(--font-mono); color: var(--muted); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font: 600 0.72rem var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.note { font-size: 0.85rem; color: var(--muted); }

@media (max-width: 900px) {
  .station { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .rail a, .rail .reset { display: none; }
  .rail select { display: block; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 600 0.95rem var(--font-body); }
  .lower { grid-template-columns: minmax(0, 1fr); }
  .device { padding: 6px; }
}
</style>
</head>

<body>


<div class="wrap">
  <header class="top">
    <span class="eyebrow" data-i18n="eyebrow"></span>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="toc">
      <span class="tape" data-i18n="tape"></span>
      <a href="#lesson-1" data-i18n="toc_lessons"></a>
      <a href="#all-lessons" data-i18n="toc_all"></a>
      <a href="#sounds" data-i18n="toc_sounds"></a>
      <a href="#keys" data-i18n="toc_keys"></a>
      <a href="#trouble" data-i18n="toc_trouble"></a>
      <button class="chip" id="midi" type="button"><span class="dot"></span><span id="midi-label">Connect MPK</span></button>
      <div class="seg lang" role="group" aria-label="Language">
        <button id="lang-en" type="button" aria-pressed="true">EN</button>
        <button id="lang-nl" type="button" aria-pressed="false">NL</button>
      </div>
    </div>
  </header>

  <div class="station" id="station">
    <nav class="rail" aria-label="Lessons" id="rail"></nav>
    <div class="stage">
      <div class="stagebar">
        <div class="seg" role="group" aria-label="Mode">
          <button id="mode-lessons" aria-pressed="true" type="button" data-i18n="mode_lessons"></button>
          <button id="mode-explore" aria-pressed="false" type="button" data-i18n="mode_explore"></button>
        </div>
        <div class="legend">
          <span><i class="dot" style="background:var(--tape)"></i><span data-i18n="leg_todo"></span></span>
          <span><i class="dot" style="background:var(--ok)"></i><span data-i18n="leg_done"></span></span>
          <span><i class="dot" style="background:var(--bank-a)"></i>bank A</span>
          <span><i class="dot" style="background:var(--bank-b)"></i>bank B</span>
        </div>
      </div>
      <div class="device">
        <svg id="mpk" viewBox="0 -48 1000 612" role="img" aria-label="Akai MPK mini 3"></svg>
        <div class="toast" id="toast"></div>
      </div>
      <div class="lower">
        <article class="card stepcard" id="stepcard" aria-live="polite"></article>
        <aside class="card info" id="info" aria-live="polite"></aside>
      </div>
      <p class="note" data-i18n="note"></p>
    </div>
  </div>

  <section class="ref" id="all-lessons">
    <h2 data-i18n="all_h2"></h2>
    <p class="intro" data-i18n="all_intro"></p>
    <div class="lessonlist" id="lessonlist"></div>
  </section>

  <section class="ref" id="sounds">
    <h2 data-i18n="sounds_h2"></h2>
    <p class="intro" data-i18n="sounds_intro"></p>
    <div class="lib" id="lib"></div>
    <h3 style="margin-top:8px" data-i18n="kits_h3"></h3>
    <p class="intro" data-i18n="kits_intro"></p>
    <div class="tablewrap"><table id="kits"></table></div>
  </section>

  <section class="ref" id="keys">
    <h2 data-i18n="keys_h2"></h2>
    <div class="tablewrap"><table id="keytable"></table></div>
  </section>

  <section class="ref" id="trouble">
    <h2 data-i18n="trouble_h2"></h2>
    <div class="tablewrap"><table id="troubletable"></table></div>
  </section>
</div>

function padLabel(i, st) {
  if (st.mode === "note") {
    if (st.bank === "A") return `LOOP ${i + 1}`;
    if (st.padb === "Steps") return `STEP ${i + 1}`;
    if (st.padb === "Chops") return `CHOP ${i + 1}`;
    if (st.padb === "Scenes") return `SCENE ${i + 1}`;
    if (st.padb === "FX") return FX_PADS[i];
    return KITS[st.kit || 0][1][i];
  }
  if (st.mode === "cc") return st.bank === "A" ? `MUTE ${i + 1}` : `UNDO ${i + 1}`;

    },
    "keys": [
     0,
     4,
     7
    ]
   },
   {
    "t": "More than 8 tracks",
    "hl": [
     [
      "pad1",
      "TAP"
     ]
    ],
    "b": "<p>Press <kbd>B</kbd>. The top line now says <b>pads: T9-16</b>: the pads and keys 1–8 work on tracks 9 to 16. Record something on pad 1: it lands on track 9. Press <kbd>B</kbd> again to go back to tracks 1–8.</p>",
    "st": {
     "bank": "A",
     "line": "Pads and keys 1-8 now address tracks 9-16"
    },
    "tr": {
     "1": "play",
     "2": "play"
    }
   },
   {
    "t": "Solo",
    "hl": [],
    "b": "<p>Press <kbd>z</kbd> <kbd>2</kbd>: you hear only track 2. Good for checking one part. Press <kbd>Z</kbd> and everything comes back.</p>",
    "st": {
     "line": "T2: solo on"
    },
    "comp": true
   },
   {
    "t": "Live effects",
    "hl": [
     [
      "pad2",
      "HOLD"
     ],
     [
      "pad5",
      "HOLD"
     ],
     [
      "pad6",
      "HOLD"
     ]
    ],
    "b": "<p>Press <kbd>m</kbd> until it says <b>FX</b>. Now the bank B pads are effects while you <b>hold</b> them: pads 1–4 repeat a small piece (stutter), pad 5 slows everything down like a tape, pad 6 plays everything backwards, pad 8 crushes the sound. Let go and the music snaps back in time.</p>",
    "st": {
     "bank": "B",
     "padb": "FX",
     "line": "Bank B pads: FX"
    }
   },
   {
    "t": "Free tempo",
    "hl": [
     [
      "k2",
      "REC MODE"
     ],
     [
      "pad1",
      "TAP"
     ],
     [
      "pad1",
      "TAP AGAIN"
     ]
    ],
    "b": "<p>Clear everything (<kbd>C</kbd> <kbd>C</kbd>). On the GLOBAL page set knob 2 (<b>Rec Mode</b>) to <b>Free→Tempo</b>. Tap pad 1 and start playing right away, no count-in. Tap pad 1 exactly when your loop should end. mpkloop works out the tempo from your loop.</p>",
    "st": {
     "page": 7,
     "line": "Tempo set from loop: 92.4 BPM (2 bars)"
    }
   },
   {
    "t": "Export your song",
    "hl": [],
    "b": "<p>Press <kbd>e</kbd>, then <kbd>3</kbd>. mpkloop writes a WAV file per track, a mix, and a MIDI file with the notes you played, to <code>~/Music/mpkloop/exports/</code>. You can open those in any music program and keep working there.</p><p class=\"tip\">Song 3 done! You now know every feature. Make something nobody has heard before.</p>",
    "st": {
     "line": "Exported: stems 4 bars, 5 MIDI tracks"
    },
    "comp": true
   }
  ]
 }

nl: [
 {
  "t": "Maak kennis met je MPK",
  "steps": [
   {
    "t": "Start mpkloop",
    "hl": [],
    "b": "<p>Sluit de MPK aan met de USB-kabel. Open een terminal, typ <code>mpkloop</code> en druk op Enter. Je ziet een grote tabel met 16 <b>tracks</b>. Elke track kan één loop bevatten: een kort stukje muziek dat zich herhaalt.</p><p class=\"tip\">Druk op <kbd>L</kbd> in mpkloop om deze pagina te openen. Klik bovenaan op <b>MPK verbinden</b> en de pagina ziet wat je op de echte MPK indrukt.</p>",
    "st": {
     "line": "mpkloop ready"
    },
    "comp": true
   },
   {
    "t": "De toetsen spelen een klank",
    "hl": [
     [
      "keys",
      "SPEEL"
     ]
    ],
    "b": "<p>Speel wat toetsen. Druk harder en de noot is luider. Speel twee of drie toetsen tegelijk voor een akkoord.</p>",
    "keys": [
     0,
     4,
     7
    ]
   },
   {
    "t": "OCT − en OCT +",
    "hl": [
     [
      "octdn",
      "DRUK"
     ],
     [
      "octup",
      "DRUK"
     ]
    ],
    "b": "<p>Deze twee knoppen schuiven de toetsen lager of hoger. Lage noten zijn voor bas, hoge noten voor melodieën. Druk beide tegelijk om terug naar het midden te gaan.</p>"
   },
   {
    "t": "De joystick",
    "hl": [
     [
      "joy",
      "BEWEEG"
     ]
    ],
    "b": "<p>Duw hem naar <b>links</b> of <b>rechts</b> terwijl je een noot vasthoudt: de noot buigt. Duw hem <b>omhoog</b>: de noot gaat wiebelen en wordt helderder.</p>",
    "joy": true
   },
   {
    "t": "De pads hebben twee banken",
    "hl": [
     [
      "bank",
      "DRUK"
     ],
     [
      "pad1",
      "TIK"
     ]
    ],
    "b": "<p>De knop <b>BANK A/B</b> schakelt de 8 pads tussen:</p><ul><li><b>Bank A</b> (rood lampje): je <b>looptracks</b>.</li><li><b>Bank B</b> (groen lampje): de <b>drums</b>.</li></ul><p>Pads 1–4 zijn de onderste rij, 5–8 de bovenste. Druk nu op BANK A/B en tik op een pad om het op het scherm te zien.</p>",
    "st": {
     "bank": "B"
    }
   },
   {
    "t": "Sla op de drums",
    "hl": [
     [
      "pad1",
      "KICK"
     ],
     [
      "pad2",
      "SNARE"
     ],
     [
      "pad3",
      "HAT"
     ]
    ],
    "b": "<p>Op bank B sla je op de pads. Pad 1 is de kick, 2 de snare, 3 de hi-hat, 4 de open hi-hat. De bovenste rij heeft een clap en meer. Sla zachter en harder.</p>",
    "st": {
     "bank": "B"
    }
   },
   {
    "t": "De draaiknoppen",
    "hl": [
     [
      "k1",
      "DRAAI"
     ]
    ],
    "b": "<p>De 8 draaiknoppen veranderen instellingen. Welke, hangt af van de <b>pagina</b>. Op de pagina Volume is knop 1 het volume van track 1, knop 2 van track 2, enzovoort. Draai er een en de naam verschijnt op het schermpje van de MPK.</p>",
    "st": {
     "page": 0
    }
   },
   {
    "t": "Twee speciale knoppen",
    "hl": [
     [
      "cc",
      "KIJK"
     ],
     [
      "pc",
      "KIJK"
     ]
    ],
    "b": "<p><b>CC</b> en <b>PROG CHANGE</b> geven de pads even een andere taak. Die gebruik je in de liedjes. Druk nog eens op dezelfde knop om de gewone pads terug te krijgen.</p><p class=\"tip\">Druk niet op <b>PROG SELECT</b> terwijl mpkloop draait.</p>"
   }
  ]
 },
 {
  "t": "Liedje 1: een beat, een bas en akkoorden",
  "steps": [
   {
    "t": "Kies een drumkit",
    "hl": [
     [
      "pc",
      "DRUK"
     ],
     [
      "bank",
      "BANK B"
     ],
     [
      "pad8",
      "TIK"
     ]
    ],
    "b": "<p>Druk op <b>PROG CHANGE</b>, ga naar <b>bank B</b> en tik op <b>pad 8</b>. Elke tik geeft de volgende drumkit: Classic, 808, 909, Electro… Kies er een die je mooi vindt en druk dan nog eens op PROG CHANGE om eruit te gaan.</p>",
    "st": {
     "mode": "pc",
     "bank": "B",
     "kit": 1,
     "line": "Drum kit: 808"
    }
   },
   {
    "t": "Neem je beat op op track 1",
    "hl": [
     [
      "pad1",
      "TIK"
     ],
     [
      "bank",
      "BANK B"
     ],
     [
      "pad1",
      "TIK NOG EENS"
     ]
    ],
    "b": "<p>Ga naar <b>bank A</b> en tik op <b>pad 1</b>. Je hoort 4 tikken: dat is het aftellen. Ga dan naar <b>bank B</b> en speel een beat: kick, hat, snare, hat… Houd het simpel.</p><p>Na 1 maat (4 tellen) of 2 maten ga je terug naar bank A en tik je nog eens op <b>pad 1</b>. Je beat herhaalt zich nu. Dat is een loop!</p><p class=\"tip\">Mislukt? Houd pad 1 een seconde vast: de track wordt gewist en je kunt opnieuw.</p>",
    "st": {
     "bank": "A",
     "line": "T1: loop 1 bar"
    },
    "tr": {
     "1": "play"
    }
   },
   {
    "t": "Kies een basklank",
    "hl": [
     [
      "pc",
      "DRUK"
     ],
     [
      "pad3",
      "TIK"
     ],
     [
      "octdn",
      "DRUK"
     ]
    ],
    "b": "<p>Druk op <b>PROG CHANGE</b>, bank B, tik op <b>pad 3: Bass</b>. Tik nog eens voor de volgende basklank. Druk op PROG CHANGE om eruit te gaan en druk dan één keer op <b>OCT −</b> zodat de toetsen laag spelen.</p>",
    "st": {
     "mode": "pc",
     "bank": "B",
     "sound": "Sub Bass"
    }
   },
   {
    "t": "Neem de bas op op track 2",
    "hl": [
     [
      "pad2",
      "TIK"
     ],
     [
      "keys",
      "SPEEL"
     ],
     [
      "pad2",
      "TIK NOG EENS"
     ]
    ],
    "b": "<p>Bank A, tik op <b>pad 2</b>. Het opnemen begint bij de volgende maat, dus je hebt even tijd. Speel een paar lage noten die bij je beat passen. Tik nog eens op pad 2 om de loop te sluiten.</p><p class=\"tip\">De loop sluit aan het eind van een maat, dus je hoeft niet precies op het juiste moment te tikken.</p>",
    "st": {
     "bank": "A",
     "sound": "Sub Bass",
     "line": "T2: loop 1 bar"
    },
    "tr": {
     "1": "play",
     "2": "play"
    },
    "keys": [
     0,
     7
    ]
   },
   {
    "t": "Akkoorden op track 3",
    "hl": [
     [
      "pc",
      "DRUK"
     ],
     [
      "pad2",
      "TIK"
     ],
     [
      "octup",
      "DRUK"
     ],
     [
      "pad3",
      "TIK"
     ]
    ],
    "b": "<p>PROG CHANGE, bank B, tik op <b>pad 1: Pads</b> of <b>pad 2: Keys</b> voor een akkoordklank. Verlaat PROG CHANGE, druk op <b>OCT +</b> om weer omhoog te gaan. Bank A, tik op <b>pad 3</b>, speel twee of drie akkoorden, tik nog eens op pad 3.</p>",
    "st": {
     "bank": "A",
     "sound": "E-Piano",
     "line": "T3: loop 2 bars"
    },
    "tr": {
     "1": "play",
     "2": "play",
     "3": "play"
    },
    "keys": [
     0,
     4,
     7
    ]
   },
   {
    "t": "Haal partijen weg en terug",
    "hl": [
     [
      "cc",
      "DRUK"
     ],
     [
      "pad1",
      "TIK"
     ],
     [
      "pad1",
      "TIK NOG EENS"
     ]
    ],
    "b": "<p>Druk op <b>CC</b>. Nu <b>dempen</b> de bank A-pads tracks: tik op pad 1 en de beat stopt bij de volgende tel; tik nog eens en hij is terug. Speel eens met alleen de akkoorden en laat dan de beat binnenkomen. Druk nog eens op CC om eruit te gaan.</p>",
    "st": {
     "mode": "cc",
     "bank": "A"
    },
    "tr": {
     "1": "mute",
     "2": "play",
     "3": "play"
    }
   },
   {
    "t": "Harder of zachter",
    "hl": [
     [
      "pc",
      "DRUK"
     ],
     [
      "pad1",
      "TIK"
     ],
     [
      "k2",
      "DRAAI"
     ],
     [
      "k3",
      "DRAAI"
     ]
    ],
    "b": "<p>Druk op PROG CHANGE, <b>bank A</b>, tik op <b>pad 1: Volume</b>, druk nog eens op PROG CHANGE. Nu is knop 1 het volume van track 1, knop 2 van track 2, knop 3 van track 3. Draai tot beat, bas en akkoorden goed samen klinken.</p>",
    "st": {
     "mode": "pc",
     "bank": "A",
     "page": 0
    }
   },
   {
    "t": "Speel erbovenop",
    "hl": [
     [
      "keys",
      "SPEEL"
     ]
    ],
    "b": "<p>Kies een klank die je mooi vindt (Leads op pad 4 zijn goed voor melodieën). Speel mee met je loops. Er wordt nu niets opgenomen, dus gewoon plezier maken. Wil je een melodie bewaren? Tik op <b>pad 4</b>, speel hem, tik nog eens.</p>",
    "st": {
     "bank": "A",
     "sound": "Saw Lead"
    },
    "tr": {
     "1": "play",
     "2": "play",
     "3": "play"
    },
    "keys": [
     12,
     14,
     16,
     19
    ]
   },
   {
    "t": "Sla je liedje op",
    "hl": [],
    "b": "<p>Druk op de computer op <kbd>s</kbd>, typ een naam zoals <i>mijn eerste liedje</i> en druk op Enter. Druk op <kbd>o</kbd> om het later weer te openen. <kbd>spatie</kbd> stopt en start het afspelen.</p><p class=\"tip\">Liedje 1 klaar! Je gebruikte: tracks, drumpads, klanken, dempen, volume en opslaan.</p>",
    "st": {
     "line": "Saved 'mijn eerste liedje'"
    },
    "comp": true
   }
  ]
 },
 {
  "t": "Liedje 2: de stepsequencer, effecten en scenes",
  "steps": [
   {
    "t": "Begin leeg",
    "hl": [],
    "b": "<p>Druk twee keer op <kbd>C</kbd> op de computer om alle tracks te wissen (sla eerst op als je Liedje 1 wilt houden). In dit liedje maakt de computer de beat en speel jij erbovenop.</p>",
    "st": {
     "line": "All tracks cleared"
    },
    "comp": true
   },
   {
    "t": "Open het stepraster",
    "hl": [],
    "b": "<p>Druk op <kbd>t</kbd>. Je ziet een raster: 8 rijen (kick, snare, hat…) en 16 stappen. Eén rij van 16 stappen is één maat. Beweeg met de pijltjestoetsen en zet een stap aan met <kbd>spatie</kbd>. Zet de kick op stap 1, 5, 9, 13 en de snare op 5 en 13. Druk op <kbd>T</kbd> om het te horen. Druk op <kbd>t</kbd> om het raster te sluiten.</p><p class=\"tip\">Met de muis: klik op een stap. Rechtsklikken maakt een stap luider of zachter.</p>",
    "st": {
     "line": "Step sequencer on"
    },
    "comp": true
   },
   {
    "t": "Teken stappen met de pads",
    "hl": [
     [
      "pad1",
      "TIK"
     ],
     [
      "pad3",
      "TIK"
     ],
     [
      "pad5",
      "TIK"
     ]
    ],
    "b": "<p>Druk op <kbd>m</kbd> tot de statusregel <b>pad B: Steps</b> zegt. Nu zetten de bank B-pads stap 1–8 aan en uit voor één drum. <kbd>Tab</kbd> gaat naar stap 9–16, <kbd>Shift-Tab</kbd> kiest de volgende drum. Voeg wat hi-hats toe. Druk op <kbd>m</kbd> tot het weer <b>Drums</b> zegt als je klaar bent.</p>",
    "st": {
     "bank": "B",
     "padb": "Steps",
     "line": "Bank B pads: Steps"
    }
   },
   {
    "t": "Swing en een andere kit",
    "hl": [
     [
      "k2",
      "SWING"
     ],
     [
      "k4",
      "KIT"
     ]
    ],
    "b": "<p>Druk op <kbd>→</kbd> tot de knoppenpagina <b>SEQ</b> zegt. Knop 2 is <b>Swing</b>: draai hem open en de beat gaat huppelen. Knop 4 kiest de <b>kit</b>. Knop 5 is het volume van de beat.</p>",
    "st": {
     "page": 11,
     "line": "Knob page: SEQ"
    }
   },
   {
    "t": "Neem de bas en akkoorden op",
    "hl": [
     [
      "pad1",
      "TIK"
     ],
     [
      "keys",
      "SPEEL"
     ],
     [
      "pad2",
      "TIK"
     ]
    ],
    "b": "<p>Net als in Liedje 1: kies een basklank (PROG CHANGE, bank B, pad 3), tik op <b>pad 1</b> op bank A, speel, tik nog eens. Dan akkoorden op <b>pad 2</b>. De sequencer speelt eronder door en wordt nooit in je loops opgenomen.</p>",
    "st": {
     "bank": "A",
     "sound": "Pluck Bass"
    },
    "tr": {
     "1": "play",
     "2": "play"
    },
    "keys": [
     0,
     3,
     7
    ]
   },
   {
    "t": "Geef je tracks een naam",
    "hl": [],
    "b": "<p>Druk op <kbd>a</kbd> en dan <kbd>1</kbd>, typ <i>Bas</i>, Enter. Druk op <kbd>a</kbd> <kbd>2</kbd>, typ <i>Akkoorden</i>. De namen staan in de tabel, zodat je altijd weet wat waar staat.</p>",
    "st": {
     "line": "Name track: press 1-8"
    },
    "comp": true
   },
   {
    "t": "Kopieer een track en maak hem langer",
    "hl": [
     [
      "pad3",
      "TIK"
     ]
    ],
    "b": "<p>Druk op <kbd>c</kbd> <kbd>2</kbd> <kbd>3</kbd>: de akkoorden worden naar track 3 gekopieerd. Druk op <kbd>D</kbd> <kbd>3</kbd>: track 3 is nu twee keer zo lang. Tik nu op <b>pad 3</b> (overdub) en speel alleen in de tweede helft een tweede akkoordpartij. Tik nog eens op pad 3. Demp track 2 met CC om alleen de nieuwe te horen.</p>",
    "st": {
     "bank": "A",
     "line": "T3: loop is now 4 bars"
    },
    "tr": {
     "1": "play",
     "2": "play",
     "3": "odub"
    }
   },
   {
    "t": "Een effect op een track",
    "hl": [
     [
      "k2",
      "EFFECT"
     ]
    ],
    "b": "<p>Druk op <kbd>→</kbd> naar de pagina <b>TRACK FX</b>. Knop 2 kiest een effect voor track 2: Crush, Drive, Chorus, Tape of Comb. Dan <kbd>→</kbd> naar <b>FX AMOUNT</b> en draai knop 2 open. Chorus op akkoorden klinkt breed; Crush op een bas klinkt als een oude videogame.</p>",
    "st": {
     "page": 8,
     "line": "Knob page: TRACK FX"
    }
   },
   {
    "t": "Duck: het pompende geluid",
    "hl": [
     [
      "k2",
      "DUCK"
     ]
    ],
    "b": "<p><kbd>→</kbd> naar de pagina <b>DUCK</b>. Draai knop 2 half open. Nu duiken de akkoorden een beetje weg elke keer als de kick slaat. Dat pompen hoor je in veel dansmuziek.</p>",
    "st": {
     "page": 10,
     "line": "Knob page: DUCK"
    }
   },
   {
    "t": "Sla twee scenes op",
    "hl": [],
    "b": "<p>Een scene onthoudt al je volumes, dempingen en effecten. Maak een rustige versie (demp de bas, draai de akkoorden zachter) en druk op <kbd>N</kbd> <kbd>1</kbd>. Maak een volle versie en druk op <kbd>N</kbd> <kbd>2</kbd>. Nu wisselen <kbd>n</kbd> <kbd>1</kbd> en <kbd>n</kbd> <kbd>2</kbd> ertussen bij de volgende maat.</p><p class=\"tip\">Op de MPK: druk op <kbd>m</kbd> tot het <b>Scenes</b> zegt. Dan roept een tik op een bank B-pad die scene op, en vasthouden slaat er een op.</p>",
    "st": {
     "line": "Scene 2 at the next bar"
    },
    "comp": true
   },
   {
    "t": "Neem een hele performance op",
    "hl": [],
    "b": "<p>Druk op <kbd>b</kbd>. Alles wat je hoort wordt nu opgenomen in een WAV-bestand. Wissel tussen je scenes, demp dingen, speel een melodie. Druk nog eens op <kbd>b</kbd> om te stoppen. Het bestand staat in <code>~/Music/mpkloop/bounces/</code>. Druk op <kbd>s</kbd> om de sessie ook op te slaan.</p><p class=\"tip\">Liedje 2 klaar! Nieuw: stepsequencer, swing, namen, kopiëren, verdubbelen, effecten, duck, scenes, bounce.</p>",
    "st": {
     "line": "Bounce saved"
    },
    "comp": true
   }
  ]
 },
 {
  "t": "Liedje 3: je eigen klanken, de sampler en een live show",
  "steps": [
   {
    "t": "Vind je favoriete klanken",
    "hl": [],
    "b": "<p>Druk op <kbd>u</kbd>. Dit is de klankbibliotheek. Beweeg met <kbd>↑</kbd> <kbd>↓</kbd> en speel de toetsen: je hoort de klank die je aanwijst. Druk op <kbd>f</kbd> bij de klanken waar je van houdt: ze krijgen een ★ en komen <b>eerst</b> als je op de MPK op die categoriepad tikt. <kbd>Esc</kbd> sluit het.</p>",
    "st": {
     "line": "★ Favorite: Hoover"
    },
    "comp": true
   },
   {
    "t": "Maak je eigen klank",
    "hl": [
     [
      "k1",
      "CUTOFF"
     ],
     [
      "k2",
      "RESONANCE"
     ],
     [
      "k4",
      "RELEASE"
     ]
    ],
    "b": "<p>Kies een klank. Ga naar de pagina <b>SOUND</b> (PROG CHANGE, bank A, pad 7). Knop 1 maakt hem donkerder of helderder, knop 2 laat hem piepen, knop 3 laat noten langzaam beginnen, knop 4 laat ze langer naklinken. Mooi? Druk op <kbd>u</kbd>, dan <kbd>n</kbd>, typ een naam. Hij staat nu in de bibliotheek met jouw naam erop.</p>",
    "st": {
     "page": 6,
     "sound": "Acid",
     "line": "Saved sound 'Mijn Acid' to the library"
    }
   },
   {
    "t": "Neem een beat op en hak hem in stukken",
    "hl": [
     [
      "pad1",
      "TIK"
     ],
     [
      "pad3",
      "TIK"
     ],
     [
      "pad2",
      "TIK"

const DEFAULT = { bank: "A", mode: "note", padb: "Drums", page: 0, sound: "Saw Pad", kit: 0, line: "" };
let mode = "lessons", li = 0, si = 0, explore = Object.assign({}, DEFAULT);

function paint(st, step) {
  const led = st.bank === "A" ? cssVar("--bank-a") : cssVar("--bank-b");
  svg.querySelectorAll("[data-id^=pad]").forEach((pg, i) => {
    pg.querySelector(".padled").setAttribute("stroke", led);

  });

  layers.modeText.textContent = `BANK ${st.bank} · ${{ note: "NOTES", cc: "CC", pc: "PROG CHANGE" }[st.mode]}${sub}`;
  layers.modeText.setAttribute("fill", led);

  layers.scr1.textContent = `${(PAGES[st.page] || "").toUpperCase().slice(0, 7)}|${st.sound}`.slice(0, 17);

  layers.hl.innerHTML = "";
  if (!step) return;
  (step.keys || []).forEach(s => layers.keyEls[s] && layers.keyEls[s].setAttribute("fill", "var(--tape)"));
  tasks.forEach((t, n) => mark(t.id, t.label, n + 1, step, t.done));
}

function mark(id, label, num, step, done) {
  const b = G[id];
  if (!b) return;
  const h = layers.hl, cls = "ring" + (done ? " done" : " pulse");
  if (id === "pads7") { for (let i = 1; i <= 7; i++) mark("pad" + i, null, null, step, done); }

  else mk("rect", { x: b.x - 6, y: b.y - 6, width: b.w + 12, height: b.h + 12, rx: 12, class: cls }, h);
  const col = done ? "var(--ok)" : "var(--tape)";
  if (/^k\d$/.test(id)) {
    const r = b.r + 15, a0 = -2.4, a1 = -0.75, p = a => `${b.cx + r * Math.cos(a)},${b.cy + r * Math.sin(a)}`;
    mk("path", { d: `M${p(a0)} A${r},${r} 0 0 1 ${p(a1)}`, fill: "none", stroke: col, "stroke-width": 3.5, "stroke-linecap": "round" }, h);

    mk("path", { d: `M${ax - 9},${ay - 3} L${ax + 2},${ay + 1} L${ax - 4},${ay + 10}`, fill: "none", stroke: col, "stroke-width": 3.5, "stroke-linecap": "round", "stroke-linejoin": "round" }, h);
  }
  if (id === "joy" && step && step.joy) for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1]]) {
    const x = b.cx + dx * 72, y = b.cy + dy * 72;
    mk("path", { d: `M${b.cx + dx * 58},${b.cy + dy * 58} L${x},${y}`, stroke: col, "stroke-width": 4, "stroke-linecap": "round" }, h);
    mk("circle", { cx: x, cy: y, r: 5, fill: col }, h);
  }
  if (num == null) return;
  const bx = b.x - 6, by = b.y - 6;
  mk("circle", { cx: bx, cy: by, r: 13, fill: col, stroke: "var(--dev-body)", "stroke-width": 2 }, h);
  txt(done ? "✓" : String(num), bx, by + 5, { "text-anchor": "middle", "font-size": 14, "font-weight": 700, fill: done ? "var(--ok-ink)" : "var(--tape-ink)" }, h);
  if (label) {

    mk("rect", { x: lx, y: ly, width: w, height: 22, rx: 2, fill: col, transform: `rotate(-1.5 ${lx + w / 2} ${ly + 11})` }, h);
    txt(label, lx + w / 2, ly + 15.5, { "text-anchor": "middle", "font-size": 13, "font-weight": 700, fill: done ? "var(--ok-ink)" : "var(--tape-ink)", "letter-spacing": 0.5 }, h);
  }
}

// live feedback on the drawing (clicks and real MIDI)
function flashControl(id, color) {
  const b = G[id];
  if (!b) return;
  const c = color || "var(--tape)";
  const el = b.shape === "circle"
    ? mk("circle", { cx: b.cx, cy: b.cy, r: b.r + 3, fill: "none", stroke: c, "stroke-width": 6, class: "flash" }, layers.live)
    : mk("rect", { x: b.x - 2, y: b.y - 2, width: b.w + 4, height: b.h + 4, rx: 10, fill: c, opacity: 0.5, class: "flash" }, layers.live);
  setTimeout(() => el.remove(), 900);
}
let keyBase = 48;   // MIDI note of the lowest key (C3 at the default octave); follows OCT -/+
function keySemi(note) {
  if (note < keyBase || note > keyBase + 24) {
    let best = keyBase, dist = 1e9;
    for (let b = 48 - 48; b <= 48 + 48; b += 12) if (note >= b && note <= b + 24 && Math.abs(b - keyBase) < dist) { best = b; dist = Math.abs(b - keyBase); }
    keyBase = best;
  }
  return note - keyBase;
}
function pressKey(semi, on) {
  const k = layers.keyEls[semi];
  if (!k) return;
  k.setAttribute("fill", on ? "var(--tape)" : (KEY_WHITE.includes(semi % 12) ? "var(--dev-key)" : "var(--dev-black)"));
}

function describe(id, st) {
  const D = tx("d");
  const pad = id.match(/^pad(\d)$/), knob = id.match(/^k(\d)$/);

    const i = +pad[1] - 1, n = i + 1;
    if (st.mode === "note" && st.bank === "A") return D.loop(n);
    if (st.mode === "note") {
      if (st.padb === "Steps") return D.step(n);
      if (st.padb === "Chops") return D.chop(n);
      if (st.padb === "Scenes") return D.scene(n);
      if (st.padb === "FX") return D.fx(n, FX_PADS[i]);
      return D.drum(n, KITS[st.kit][1][i], KITS[st.kit][0]);
    }
    if (st.mode === "cc" && st.bank === "A") return D.mute(n);
    if (st.mode === "cc") return D.undo(n);
    if (st.bank === "A") return D.page(n, PAGES[i], PAGE_PARAMS[i].join(", "));
    if (i < 7) return D.cat(n, CATS[i][0], CAT_HINTS[lang][i], CATS[i][1].join(" → "));
    return D.kit;
  }
  if (knob) {
    const k = +knob[1] - 1;
    if (st.page == null) return D.knob(k + 1);
    const name = PAGE_PARAMS[st.page][k];
    return [D.knobp(k + 1, name), paramHelp(st.page, name) + ` (${PAGES[st.page]})`];
  }
  return D[id] || [id, ""];
}
const STATE_TXT = { play: "▶ PLAY ", rec: "● REC  ", armed: "◌ ARMED", odub: "◉ ODUB ", mute: "▷ MUTED", empty: "· empty" };
function mockScreen(step, st) {
  if (!step || (!step.tr && !st.line)) return "";
  const tr = step.tr || {};
  const rows = [1, 2, 3, 4, 5].filter(n => n <= 4 || tr[n]).map(n => {
    const s = tr[n] || "empty";
    return `<span class="t">${n}</span> <span class="${s}">${STATE_TXT[s]}</span>`;
  });
  return `<div class="mock"><span class="t">mpkloop · TRACKS</span>\n${rows.join("\n")}${st.line ? `\n<span class="t">LOG</span>  <span class="log"></span>` : ""}</div>`;
}
function showInfo(h, d, st, step) {
  const info = document.getElementById("info");
  const modeTxt = { note: tx("mode_normal") + (st.bank === "B" && st.padb && st.padb !== "Drums" ? ` (${st.padb})` : ""), cc: "CC", pc: "PROG CHANGE" }[st.mode];
  info.innerHTML = `<span class="eyebrow">${mode === "explore" ? tx("explore") : tx("what_this_does")}</span><h3></h3><p class="what"></p>
    <p class="state">${tx("pads_state")(st.bank, modeTxt, PAGES[st.page] || "-")}</p>${mockScreen(step, st)}`;
  info.querySelector("h3").textContent = h;
  info.querySelector(".what").textContent = d;
  const log = info.querySelector(".mock .log"); if (log) log.textContent = st.line;
}

// ------------------------------------------------------------------ tasks (clicks + MIDI)
function taskMatchesControl(task, id) {
  if (task.id === id) return true;
  if ((task.id === "pads" || task.id === "pads7") && /^pad\d$/.test(id)) return task.id === "pads" || +id[3] <= 7;
  if (task.id === "knobs" && /^k\d$/.test(id)) return true;
  return false;
}
function completeTask(idx, via) {
  if (mode !== "lessons" || tasks[idx].done) return;
  for (let i = 0; i <= idx; i++) tasks[i].done = true;   // a later move implies the earlier ones
  paint(stepState(li, si), L[li].steps[si]);
  renderTasks();
  if (tasks.every(t => t.done)) finishStep(via);
  else toast(tx("n_of_m")(tasks.filter(t => t.done).length, tasks.length));
}
function finishStep(via) {
  const key = `${li}.${si}`;
  progress.add(key); saveProgress();
  renderRail(); renderStepNav();
  toast(via === "midi" ? tx("done_midi") : tx("done_step"), true);
  document.querySelectorAll("#lessonlist li").forEach(el => { if (el.dataset.key === key) el.classList.add("done"); });
}

function onControl(id) {
  const st = curState();
  flashControl(id);
  if (mode === "explore") {
    if (id === "bank") explore.bank = explore.bank === "A" ? "B" : "A";
    if (id === "cc") explore.mode = explore.mode === "cc" ? "note" : "cc";
    if (id === "pc") explore.mode = explore.mode === "pc" ? "note" : "pc";
    const pad = id.match(/^pad(\d)$/);
    if (pad && explore.mode === "pc") {
      const i = +pad[1] - 1;
      if (explore.bank === "A") { explore.page = i; explore.line = PAGES[i] + " " + tx("page_word"); }
      else if (i < 7) { const list = CATS[i][1], cur = list.indexOf(explore.sound); explore.sound = list[(cur + 1) % list.length]; explore.line = CATS[i][0]; }
      else { explore.kit = (explore.kit + 1) % KITS.length; explore.line = tx("kit_word") + ": " + KITS[explore.kit][0]; }
    }
    paint(explore, null);
    const [h, d] = describe(id, explore);
    showInfo(h, d, explore, null);
    return;
  }
  const [h, d] = describe(id, st);
  showInfo(h, d, st, L[li].steps[si]);
  const idx = tasks.findIndex(t => !t.done && taskMatchesControl(t, id));
  if (idx >= 0) completeTask(idx, "click");
  else if (tasks.length && !tasks.every(t => t.done)) {
    const next = tasks.find(t => !t.done);
    toast(tx("thats")(h.split(":")[0], describe(next.id, st)[0].split(":")[0], next.label.toLowerCase()));
  }
}

// ------------------------------------------------------------------ Web MIDI
const midiBtn = document.getElementById("midi"), midiLabel = document.getElementById("midi-label");
let midiOn = false, lastBank = "A";
function setMidiStatus(cls, label) { midiBtn.className = "chip " + cls; midiLabel.textContent = label; }
async function connectMIDI() {
  if (!navigator.requestMIDIAccess) { setMidiStatus("err", tx("no_webmidi")); toast(tx("webmidi_hint")); return; }
  try {
    const access = await navigator.requestMIDIAccess({ sysex: false });
    const hook = () => {
      const ins = [...access.inputs.values()];
      const mpk = ins.find(i => /mpk/i.test(i.name)) || ins[0];
      ins.forEach(i => i.onmidimessage = null);
      if (!mpk) { midiOn = false; setMidiStatus("err", tx("no_device")); return; }
      mpk.onmidimessage = ev => onMidi(ev.data);
      midiOn = true; setMidiStatus("on", (/mpk/i.test(mpk.name) ? tx("connected") : mpk.name) + " · " + tx("listening"));
      if (mode === "lessons") renderTasks();
    };
    access.onstatechange = hook; hook();
  } catch (e) {
    setMidiStatus("err", tx("blocked"));
    toast(tx("blocked_hint"));
  }
}
midiBtn.addEventListener("click", connectMIDI);

let stickX = 0, stickY = 0;
function moveStick(x, y) {
  if (x != null) stickX = x; if (y != null) stickY = y;
  layers.stick.setAttribute("transform", `translate(${stickX * 26} ${stickY * 26})`);
  flashControl("joy");
}
// data: [status, d1, d2]
function onMidi(data) {
  const st = curState(), step = mode === "lessons" ? L[li].steps[si] : null;
  const type = data[0] & 0xf0, ch = data[0] & 0x0f, d1 = data[1], d2 = data[2];
  const satisfy = pred => {
    if (mode !== "lessons") return false;
    const idx = tasks.findIndex(t => !t.done && pred(t));
    if (idx >= 0) completeTask(idx, "midi");
    return idx >= 0;
  };
  const padEvent = (k, kind) => {
    const i = k % 8, bank = k < 8 ? "A" : "B";
    lastBank = bank;
    if (mode === "explore") { explore.bank = bank; explore.mode = kind; paint(explore, null); }
    flashControl("pad" + (i + 1), bank === "A" ? cssVar("--bank-a") : cssVar("--bank-b"));
    layers.scr2.textContent = `${kind === "note" ? "pad" : kind.toUpperCase()} ${i + 1} · bank ${bank}`;
    const bankOk = st.bank === bank;
    // the specific pad move wins (and implies the BANK / CC / PROG CHANGE presses before it)
    if (!satisfy(t => (t.id === "pad" + (i + 1) && bankOk) || t.id === "pads" || (t.id === "pads7" && i < 7)))
      satisfy(t => (t.id === "bank" && bankOk) || (t.id === "cc" && kind === "cc") || (t.id === "pc" && kind === "pc"));
  };
  if (type === 0x90 && d2 > 0) {
    if (ch === PAD_CH && d1 >= PAD_NOTE0 && d1 < PAD_NOTE0 + 16) return padEvent(d1 - PAD_NOTE0, "note");
    pressKey(keySemi(d1), true);
    layers.scr2.textContent = `note ${d1} vel ${d2}`;
    satisfy(t => t.id === "keys");
  } else if (type === 0x80 || (type === 0x90 && d2 === 0)) {
    if (ch !== PAD_CH) { const semi = keySemi(d1); pressKey(semi, !!(step && (step.keys || []).includes(semi))); }
  } else if (type === 0xb0) {
    if (ch === PAD_CH && d1 >= PAD_CC0 && d1 < PAD_CC0 + 16) { if (d2 > 0) padEvent(d1 - PAD_CC0, "cc"); return; }
    if (d1 >= KNOB_CC0 && d1 < KNOB_CC0 + 8) {
      const k = d1 - KNOB_CC0, b = G["k" + (k + 1)];
      flashControl("k" + (k + 1));
      // mpkloop puts the knobs in relative mode (1..63 = up, 65..127 = down); absolute values turn the pointer directly
      const rel = d2 < 64 ? d2 : d2 - 128;
      b.ang = midiOn && Math.abs(rel) <= 16 ? Math.max(-150, Math.min(150, b.ang + rel * 10)) : d2 / 127 * 300 - 150;
      layers.knobPtr[k].setAttribute("transform", `rotate(${b.ang} ${b.cx} ${b.cy})`);
      layers.scr2.textContent = st.page != null ? PAGE_PARAMS[st.page][k] : "knob " + (k + 1);
      satisfy(t => t.id === "k" + (k + 1) || t.id === "knobs");
    } else if (d1 === 1) { moveStick(null, -d2 / 127); satisfy(t => t.id === "joy"); }
    else if (d1 === 64) { flashControl("sustain"); satisfy(t => t.id === "sustain"); }
  } else if (type === 0xe0) {
    moveStick((((d2 << 7) | d1) - 8192) / 8192, null); satisfy(t => t.id === "joy");
  } else if (type === 0xc0) {
    if (d1 >= PAD_PC0 && d1 < PAD_PC0 + 16) padEvent(d1 - PAD_PC0, "pc");
  } else if (type === 0xd0 && d1 > 40) {
    flashControl("pads"); satisfy(t => /^pad\d$/.test(t.id) && /HOLD|SQUEEZE|HOUD|KNIJP/.test(t.label));
  }
}
window.__onMidi = onMidi;

// ------------------------------------------------------------------ lesson UI
const rail = document.getElementById("rail");
function buildRail() {
  rail.innerHTML = "";
  const sel = document.createElement("select"); sel.id = "lesson-select"; sel.setAttribute("aria-label", tx("lesson"));
  L.forEach((l, i) => {
    const a = document.createElement("a");
    a.href = `#lesson-${i + 1}-step-1`;
    a.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span><span class="title"></span><span class="prog"></span>`;
    a.querySelector(".title").textContent = l.t;
    a.addEventListener("click", ev => { ev.preventDefault(); go(i, 0, true); });
    rail.appendChild(a);
    const o = document.createElement("option"); o.value = i; o.textContent = `${i + 1}. ${l.t}`; sel.appendChild(o);
  });
  sel.addEventListener("change", () => go(+sel.value, 0, true));
  rail.appendChild(sel);
  const r = document.createElement("button"); r.className = "reset"; r.type = "button"; r.textContent = tx("reset");
  r.addEventListener("click", () => { progress = new Set(); saveProgress(); renderStep(); document.querySelectorAll("#lessonlist li").forEach(el => el.classList.remove("done")); });
  rail.appendChild(r);
}
function renderRail() {
  rail.querySelectorAll("a").forEach((a, i) => {
    a.setAttribute("aria-current", i === li ? "true" : "false");
    const n = L[i].steps.filter((_, j) => progress.has(`${i}.${j}`)).length, tot = L[i].steps.length;
    const p = a.querySelector(".prog"); p.textContent = n === tot ? "✓" : (n ? `${n}/${tot}` : ""); p.className = "prog" + (n === tot ? " full" : "");
  });
  const sel = document.getElementById("lesson-select"); if (sel) sel.value = li;
}
function renderTasks() {
  const ul = document.getElementById("tasks");
  if (!ul) return;
  const st = stepState(li, si);
  ul.innerHTML = "";
  tasks.forEach((t, i) => {
    const el = document.createElement("li");
    el.className = t.done ? "done" : "";
    const name = describe(t.id, st)[0];
    el.innerHTML = `<span class="num">${t.done ? "✓" : i + 1}</span><span><span class="what"><b></b> · <span class="name"></span></span><br><span class="how">${t.done ? tx("done") : (midiOn ? tx("do_midi") : tx("do_click"))}</span></span>`;
    el.querySelector("b").textContent = t.label; el.querySelector(".name").textContent = name;
    el.addEventListener("click", () => onControl(t.id === "pads7" || t.id === "pads" ? "pad1" : t.id === "knobs" ? "k1" : t.id));
    ul.appendChild(el);
  });
}
function renderStepNav() {
  const nav = document.getElementById("stepnav");
  if (!nav) return;
  const lesson = L[li], last = li === L.length - 1 && si === lesson.steps.length - 1;
  const done = progress.has(`${li}.${si}`);
  const nextLabel = done ? (last ? tx("all_done") : si === lesson.steps.length - 1 ? tx("next_lesson") : tx("next")) : (tasks.length ? tx("skip") : tx("done_next"));
  nav.innerHTML = `
    <button class="btn ghost" id="prev" type="button" ${li === 0 && si === 0 ? "disabled" : ""}>${tx("back")}</button>
    <div class="dots">${lesson.steps.map((_, i) => `<i class="${progress.has(`${li}.${i}`) ? "done" : (i <= si ? "on" : "")}"></i>`).join("")}</div>
    <button class="btn ${done ? "ok ready" : ""}" id="next" type="button" ${last && done ? "disabled" : ""}>${nextLabel}</button>`;
  nav.querySelector("#prev").addEventListener("click", () => move(-1));
  nav.querySelector("#next").addEventListener("click", () => { if (!tasks.length && !done) { progress.add(`${li}.${si}`); saveProgress(); } move(1); });
}
function renderStep() {
  const lesson = L[li], step = lesson.steps[si];
  tasks = step.hl.map(([id, label]) => ({ id, label, done: progress.has(`${li}.${si}`) }));
  renderRail();
  const card = document.getElementById("stepcard");
  card.innerHTML = `
    <span class="eyebrow">${tx("lesson")} ${li + 1} · ${lesson.t} · ${tx("step")} ${si + 1} ${tx("of")} ${lesson.steps.length}</span>
    <h3></h3>
    <div class="body">${step.b}</div>
    ${tasks.length ? `<span class="eyebrow">${tx("your_moves")}</span><ul class="tasks" id="tasks"></ul>` : (step.comp ? `<p class="tip">${tx("comp_tip")}</p>` : "")}
    <div class="nav" id="stepnav"></div>`;
  card.querySelector("h3").textContent = step.t;
  renderTasks(); renderStepNav();
  const st = stepState(li, si);
  paint(st, step);
  const first = tasks[0];
  if (first) { const [h, d] = describe(first.id, st); showInfo(h, d, st, step); }
  else showInfo(tx("on_computer"), tx("on_computer_d"), st, step);
  try { localStorage.setItem("mpkloop-lesson", JSON.stringify([li, si])); } catch (e) {}
}
function go(l, s, scroll) {
  li = l; si = s; setMode("lessons"); renderStep();
  const h = `#lesson-${l + 1}-step-${s + 1}`;
  if (location.hash !== h) { try { history.replaceState(null, "", h); } catch (e) { try { location.hash = h; } catch (e2) {} } }
  if (scroll) document.getElementById("station").scrollIntoView({ block: "start" });
}
function move(d) {
  let l = li, s = si + d;
  if (s >= L[l].steps.length) { if (l < L.length - 1) { l++; s = 0; } else return; }
  if (s < 0) { if (l > 0) { l--; s = L[l].steps.length - 1; } else return; }
  go(l, s);
}
function setMode(m) {
  mode = m;
  document.getElementById("mode-lessons").setAttribute("aria-pressed", m === "lessons");
  document.getElementById("mode-explore").setAttribute("aria-pressed", m === "explore");
  if (m === "explore") {
    explore = Object.assign({}, DEFAULT, { bank: lastBank });
    tasks = [];
    paint(explore, null);
    document.getElementById("stepcard").innerHTML = `<span class="eyebrow">${tx("mode_explore")}</span><h3>${tx("explore_h")}</h3>
      <div class="body">${tx("explore_b")}</div>
      <div class="nav"><button class="btn ghost" id="back" type="button">${tx("back_lessons")}</button></div>`;
    document.getElementById("back").addEventListener("click", () => go(li, si));
    showInfo(tx("pick"), tx("pick_d"), explore, null);
  }
}
document.getElementById("mode-lessons").addEventListener("click", () => go(li, si));
document.getElementById("mode-explore").addEventListener("click", () => setMode("explore"));
document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
document.getElementById("lang-nl").addEventListener("click", () => setLang("nl"));
document.addEventListener("keydown", e => {
  if (mode !== "lessons" || (e.target.closest && e.target.closest("select, input, textarea, button"))) return;
  if (e.key === "ArrowRight") move(1);
  if (e.key === "ArrowLeft") move(-1);
});
function fromHash() {
  const m = location.hash.match(/^#lesson-(\d+)(?:-step-(\d+))?$/);
  if (!m || !L[+m[1] - 1]) return false;
  const l = +m[1] - 1, s = m[2] ? Math.min(+m[2] - 1, L[l].steps.length - 1) : 0;
  if (l !== li || s !== si || mode !== "lessons") go(l, s, true);
  return true;
}
window.addEventListener("hashchange", fromHash);

// ------------------------------------------------------------------ reference sections
function buildRef() {
  const list = document.getElementById("lessonlist");
  list.innerHTML = "";
  L.forEach((l, i) => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<span class="eyebrow">${tx("lesson")} ${i + 1}</span><h3></h3><ol></ol>`;
    c.querySelector("h3").textContent = l.t;
    l.steps.forEach((s, j) => {
      const item = document.createElement("li"); item.dataset.key = `${i}.${j}`;
      if (progress.has(item.dataset.key)) item.className = "done";
      const a = document.createElement("a"); a.href = `#lesson-${i + 1}-step-${j + 1}`; a.textContent = s.t;
      a.addEventListener("click", ev => { ev.preventDefault(); go(i, j, true); });
      item.appendChild(a); c.querySelector("ol").appendChild(item);
    });
    list.appendChild(c);
  });
  const lib = document.getElementById("lib");
  lib.innerHTML = "";
  CATS.forEach(([name, sounds], i) => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<span class="padtag">${tx("padtag")} ${i + 1}</span><h3></h3><p class="note"></p><ul>${sounds.map((s, j) => `<li>${j + 1}. ${s}</li>`).join("")}</ul>`;
    c.querySelector("h3").textContent = name; c.querySelector(".note").textContent = CAT_HINTS[lang][i];
    lib.appendChild(c);
  });
  document.getElementById("kits").innerHTML = `<tr><th>${tx("th_kit")}</th>${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<th>${tx("pad")} ${n}</th>`).join("")}</tr>` +
    KITS.map(([k, d]) => `<tr><td><b>${k}</b></td>${d.map(x => `<td>${x}</td>`).join("")}</tr>`).join("");
}

build(); applyLang(); buildRail(); buildRef();
let start = [0, 0];
try { const s = JSON.parse(localStorage.getItem("mpkloop-lesson")); if (Array.isArray(s) && L[s[0]] && L[s[0]].steps[s[1]]) start = s; } catch (e) {}
if (!fromHash()) go(start[0], start[1]);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => mode === "lessons" ? renderStep() : paint(explore, null));
</script>
